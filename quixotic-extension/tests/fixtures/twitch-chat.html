<!-- Synthetic Twitch chat (structure modelled on twitch.tv chat lines; names and text are made up). -->
<html><body>
<div class="chat-scrollable-area__message-container" data-test-selector="chat-scrollable-area__message-container">
  <div class="chat-line__message" data-a-target="chat-line-message" data-a-user="ali_gamer">
    <span class="chat-line__timestamp">10:41</span>
    <span class="chat-badge"><img alt="Subscriber" class="chat-badge"></span>
    <span class="chat-author__display-name" data-a-user="ali_gamer">Ali_Gamer</span><span aria-hidden="true">: </span>
    <span data-a-target="chat-line-message-body"><span class="text-fragment">yo can u make my stream overlay?</span>
      <img class="chat-image chat-line__message--emote" alt="PogChamp"></span>
  </div>
  <div class="chat-line__message" data-a-target="chat-line-message" data-a-user="nightbot">
    <span class="chat-author__display-name" data-a-user="nightbot">Nightbot</span><span aria-hidden="true">: </span>
    <span data-a-target="chat-line-message-body"><span class="text-fragment">Follow the channel!</span></span>
  </div>
  <div class="chat-line__message" data-a-target="chat-line-message" data-a-user="sara_quixotic">
    <span class="chat-author__display-name" data-a-user="sara_quixotic">Sara_Quixotic</span><span aria-hidden="true">: </span>
    <span data-a-target="chat-line-message-body"><span class="mention-fragment">@Ali_Gamer</span><span class="text-fragment"> sure, which colours?</span></span>
  </div>
  <div class="chat-line__status">Ali_Gamer is now a subscriber</div>
  <div class="chat-line__message" data-a-target="chat-line-message" data-a-user="ali_gamer">
    <span class="chat-author__display-name" data-a-user="ali_gamer">Ali_Gamer</span><span aria-hidden="true">: </span>
    <span data-a-target="chat-line-message-body"><span class="text-fragment">purple and black,   budget $50</span></span>
  </div>
</div>
<div class="chat-input"><textarea data-a-target="chat-input">draft not sent</textarea></div>
</body></html>
