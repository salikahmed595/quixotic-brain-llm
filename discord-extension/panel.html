<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quixotic Reply Assistant</title>
  <style>
    :root { --fg: #1f2328; --bg: #fff; --muted: #59636e; --line: #d1d9e0; --accent: #5865f2; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --muted: #9198a1; --line: #3d444d; } }
    body { font: 14px system-ui, sans-serif; margin: 16px; color: var(--fg); background: var(--bg); }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    button.link { background: none; color: var(--accent); padding: 0; text-decoration: underline; }
    input { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: transparent;
            border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: transparent;
               border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #draft { min-height: 120px; }
    .muted { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Quixotic Reply Assistant</h1>
  <form id="signin" hidden>
    <label for="ident">Quixotic AI username or email</label>
    <input id="ident" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button id="login" type="submit">Sign in</button></div>
    <p class="muted">Your own account, so only what you're allowed to see is used. The password is not saved.</p>
  </form>
  <div id="app" hidden>
  <p class="muted">Signed in to Quixotic AI. <button id="logout" class="link" type="button">Sign out</button></p>
  <label for="staff">Staff names (as shown in Discord)</label>
  <textarea id="staff" rows="2" placeholder="Sara | Quixotic, Bilal"></textarea>
  <p class="muted">Everyone else in the chat counts as the customer. Bots are skipped.</p>
  <div class="row"><button id="go">Draft reply</button></div>
  <p id="status" class="muted" role="status"></p>
  <label for="draft">Draft (private, not sent)</label>
  <textarea id="draft" readonly></textarea>
  <div class="row"><button id="copy" disabled>Copy</button></div>
  <p class="muted">Check prices, dates and promises before you paste and send it yourself.</p>
  </div>
  <p id="authStatus" class="muted" role="status"></p>
  <script type="module" src="panel.js"></script>
</body>
</html>
