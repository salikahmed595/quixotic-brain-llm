# Hermes Agent configuration for Quixotic AI (copied to the Hermes data folder as config.yaml).
# docs/HERMES_TELEGRAM_OBSIDIAN_PLAN.md H0/H1. PRD §15: no open-ended filesystem/shell permissions — Hermes gets ONLY the
# quixotic MCP tools. Verify after every Hermes upgrade with:  docker compose run --rm hermes tools   (step H0 in the plan).
model:
  provider: openai                 # OPENAI_API_KEY in Hermes' .env; DeepSeek later through an OpenAI-compatible endpoint
toolsets:
  - hermes-telegram
agent:
  # Everything Hermes ships with is switched off except `clarify` (asking the sender a question with buttons). Verified with
  # `hermes tools list --platform telegram` on nousresearch/hermes-agent:stable (2026-10-17): before this list, `computer_use`
  # (desktop control) and `connections` stayed enabled. Re-check after every Hermes upgrade (H0) — new versions add toolsets.
  disabled_toolsets: [web, search, browser, terminal, file, code_execution, vision, video, image_gen, video_gen, x_search, tts, stt,
                      skills, todo, kanban, memory, context_engine, session_search, connections, delegation, cronjob, yuanbao,
                      computer_use, a2a, messaging, debugging, discord, discord_admin]
approvals:
  mode: manual
  unattended_mode: deny
  cron_mode: deny
  single_query_mode: deny
unauthorized_dm_behavior: ignore   # only TELEGRAM_ALLOWED_USERS may talk to it
security:
  allow_private_urls: false
stt:
  enabled: true
  provider: openai                 # owner decision 2026-10-17 (VOICE_TOOLS_OPENAI_KEY)
mcp_servers:
  quixotic:
    url: "http://quixotic-mcp:8765/mcp"           # internal Docker network only
    headers:
      Authorization: "Bearer ${QUIXOTIC_MCP_TOKEN}"
    tools:
      include: [get_context, search_approved_knowledge, propose_knowledge_change, get_proposal_status, report_knowledge_gap]
      prompts: false
      resources: false
